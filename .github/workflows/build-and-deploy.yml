name: Build

on:
  push:
    branches:
      - 'mc1.21.1/main'
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Prepare downloadable mod jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No mod jar found in build/libs" >&2
            find build -name '*.jar' -type f >&2 || true
            exit 1
          fi

          mod_version=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          dest="dist/create_mobile_packages-${mc_version}-${mod_version}-compatibility-with-fluid-logistics-fix.jar"
          cp "${jars[0]}" "$dest"
          echo "Packed $(basename "$dest")"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: create-mobile-packages-compatibility-with-fluid-logistics-fix
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
